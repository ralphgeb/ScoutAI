name: Scout stocks list service

# Deploys stocks-worker to Cloudflare Workers: the shared list of stocks people follow in the
# Scout iPhone app, read by the morning update to write their AI summaries.
# Needs GitHub secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (the same ones as Halo's
# Whoop sign-in service). Creates its KV store the first time.
# Needed for reliable timing: SCOUT_DISPATCH_TOKEN, a GitHub key that can start this repository's
# workflows. Every 10 minutes the service uses it to start the update (which checks what's due),
# because GitHub's own schedule often runs only a few times a day; it also gives newly added
# stocks their AI summary within minutes.
# Optional: WEATHERKIT_KEY_ID, WEATHERKIT_PRIVATE_KEY and APPLE_TEAM_ID, for the shared weather
# (one Apple Weather call per area every 30 minutes, shared by everyone nearby).
# Optional: PRIM_API_KEY (free, from prim.iledefrance-mobilites.fr), for Paris metro status.
# New York's needs no key.
on:
  workflow_dispatch:
  push:
    paths:
      - stocks-worker/**
      - .github/workflows/stocks-worker.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stocks-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCOUT_DISPATCH_TOKEN: ${{ secrets.SCOUT_DISPATCH_TOKEN }}
      WEATHERKIT_KEY_ID: ${{ secrets.WEATHERKIT_KEY_ID }}
      WEATHERKIT_PRIVATE_KEY: ${{ secrets.WEATHERKIT_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the secrets are set
        id: secrets
        run: |
          ready=true
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then ready=false; echo "::notice::Missing GitHub secret $v"; fi
          done
          if [ "$ready" = false ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this repository's secrets first"; exit 1
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Create the KV store (first time) and deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          # Pasted secrets often pick up a line break or spaces, which breaks the request header.
          token=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          account=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token" CLOUDFLARE_ACCOUNT_ID="$account"
          W="npx --yes wrangler@3.80.0"

          # What the token can do, without printing it: its shape, whether Cloudflare accepts it,
          # and whether it can see this account and its Workers and KV storage.
          echo "API token: ${#token} characters (usually 40). Account ID: ${#account} characters (should be 32)."
          api() { curl -s -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/$1"; }
          verdict() { python3 -c "import json,sys; d=json.load(sys.stdin); print('ok' if d.get('success') else 'refused: ' + '; '.join(e.get('message','') for e in d.get('errors') or []))"; }
          case "$token" in cf*_*) echo "Token format: new Cloudflare style (starts cf…_)";; *) echo "Token format: classic";; esac
          echo "Token valid (user):     $(api user/tokens/verify | verdict)"
          echo "Token valid (account):  $(api accounts/$account/tokens/verify | verdict)"
          echo "Account visible:        $(api accounts/$account | verdict)"
          echo "Workers scripts access: $(api accounts/$account/workers/scripts | verdict)"
          echo "KV storage access:      $(api "accounts/$account/storage/kv/namespaces?per_page=1" | verdict)"

          find_id() {
            curl -s -H "Authorization: Bearer $token" \
              "https://api.cloudflare.com/client/v4/accounts/$account/storage/kv/namespaces?per_page=100" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((n['id'] for n in d.get('result') or [] if n['title']=='scout-stocks-requests'), ''))"
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            echo "Creating the KV store…"
            curl -s -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d '{"title":"scout-stocks-requests"}' \
              "https://api.cloudflare.com/client/v4/accounts/$account/storage/kv/namespaces" > create.json
            python3 -c "import json; d=json.load(open('create.json')); print('created' if d.get('success') else d.get('errors'))"
            id=$(find_id)
          fi
          if [ -z "$id" ]; then
            echo "::error::Couldn't create or find the KV store. The Cloudflare token needs 'Workers KV Storage: Edit' as well as 'Workers Scripts: Edit'."
            exit 1
          fi
          printf '\n[[kv_namespaces]]\nbinding = "REQUESTS"\nid = "%s"\n' "$id" >> wrangler.toml
          $W deploy 2>&1 | tee deploy.log
          url=$(grep -oE "https://[a-zA-Z0-9.-]+\.workers\.dev" deploy.log | head -1)
          echo "::notice::Scout stocks list: $url (the app expects https://scout-stocks.ralph-gebara.workers.dev)"
          curl -s "$url/list" | head -c 300; echo

          # The key for quick summaries, if it's been added.
          if [ -n "$SCOUT_DISPATCH_TOKEN" ]; then
            gh=$(printf %s "$SCOUT_DISPATCH_TOKEN" | tr -d '[:space:]')
            echo "::add-mask::$gh"
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $gh" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows")
            echo "GitHub key for quick summaries: $([ "$code" = 200 ] && echo "accepted" || echo "refused ($code)")"
            printf %s "$gh" | $W secret put DISPATCH_TOKEN
            echo "::notice::Reliable timing is on: every 10 minutes the service starts the update for whatever is due (6:00 briefing, prices every 30 minutes), and new stocks get their AI summary within about 10 minutes."
          else
            echo "::warning::No SCOUT_DISPATCH_TOKEN secret: updates rely on GitHub's own schedule, which often runs only a few times a day, and new stocks get their AI summary with the morning update."
          fi

          # Shared weather, if the WeatherKit key has been added.
          if [ -n "$WEATHERKIT_KEY_ID" ] && [ -n "$WEATHERKIT_PRIVATE_KEY" ] && [ -n "$APPLE_TEAM_ID" ]; then
            printf %s "$WEATHERKIT_KEY_ID" | tr -d '[:space:]' | $W secret put WEATHERKIT_KEY_ID
            printf %s "$APPLE_TEAM_ID" | tr -d '[:space:]' | $W secret put APPLE_TEAM_ID
            printf %s "$WEATHERKIT_PRIVATE_KEY" | $W secret put WEATHERKIT_PRIVATE_KEY
            sleep 5
            code=$(curl -s -o weather.json -w "%{http_code}" "$url/weather?lat=51.51&lon=-0.13&tz=Europe/London")
            if [ "$code" = 200 ]; then
              echo "::notice::Shared weather is on: $(python3 -c "import json; d=json.load(open('weather.json')); print(f\"London now {d['current']['temp']}°, {len(d['hours'])} hours ahead\")")"
            else
              echo "::warning::Shared weather answered $code: $(head -c 200 weather.json). Check the WeatherKit key, its key ID and the team ID."
            fi
          else
            echo "::notice::Shared weather is off (add WEATHERKIT_KEY_ID, WEATHERKIT_PRIVATE_KEY and APPLE_TEAM_ID): each iPhone asks Apple Weather itself."
          fi

          # Metro status: New York needs no key, Paris needs PRIM_API_KEY.
          if [ -n "$PRIM_API_KEY" ]; then
            printf %s "$PRIM_API_KEY" | tr -d '[:space:]' | $W secret put PRIM_API_KEY
            sleep 5
          else
            echo "::notice::Paris metro status is off (add PRIM_API_KEY): Paris shows as unavailable in the app."
          fi
          for city in nyc paris; do
            code=$(curl -s -o transit.json -w "%{http_code}" "$url/transit/$city")
            if [ "$code" = 200 ]; then
              echo "::notice::$city metro status: $(python3 -c "import json; d=json.load(open('transit.json')); bad=[l['name']+': '+l['status'] for l in d['lines'] if l['level']]; print(f\"{len(d['lines'])} lines, \" + ('; '.join(bad) if bad else 'good service on all'))")"
            else
              echo "::warning::$city metro status answered $code: $(head -c 200 transit.json)"
            fi
          done
