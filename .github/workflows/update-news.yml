name: Update news

on:
  schedule:
    # Checks every 30 minutes whether anything is due (London time):
    #   - the news and Today briefing once a day from 6:00 (at half price
    #     through the AI batch queue, which can take a while, so it is ready early)
    #   - stock prices every 30 minutes on weekdays (published to the Scout service, see scripts/publish.mjs)
    # GitHub often starts scheduled runs late or skips some, so the updater
    # catches up on anything missed instead of relying on exact times.
    # Checks with nothing to do take a few seconds.
    - cron: "12,42 * * * *"
    # Just before 7:00 London time (summer and winter) for the morning notification.
    - cron: "56 5,6 * * *"
  workflow_dispatch:          # the "Run workflow" button and the app's refresh button
    inputs:
      briefing:
        description: "Write a new Today briefing? (auto = only if the last one is over 8 hours old)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto
      mode:
        description: "full = news and stocks, stocks = stocks only (quick), prices = prices only (quickest), notify = send the morning notification now"
        type: choice
        options: [full, stocks, prices, subscribe, notify]
        default: full
      watchlist:
        description: "Your stocks, sent by the app (leave empty)"
        type: string
        default: ""
      push:
        description: "Notification sign-up, sent by the app (leave empty)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
        with:
          sparse-checkout: |
            scripts/due.mjs
            data/news.json
            data/stocks.json
          sparse-checkout-cone-mode: false
      - name: What's due?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "mode=${{ github.event.inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"
          else
            node scripts/due.mjs
          fi

  update:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Only one update at a time; a waiting one is never cancelled by a check.
    concurrency:
      group: update-news
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # If this run waited behind another update, check it's still needed.
      - name: Still due?
        id: again
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then node scripts/due.mjs; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v5
        if: steps.again.outputs.go == 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.again.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install the stock price and notification tools
        if: steps.again.outputs.go == 'true'
        run: |
          pip install --quiet --upgrade yfinance financedatabase ddgs
          npm install --no-save --no-audit --no-fund --silent web-push@3.6.7

      - name: Collect and analyse news
        if: steps.again.outputs.go == 'true'
        run: node scripts/update-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_BRIEFING: ${{ github.event.inputs.briefing || 'auto' }}
          MODE: ${{ needs.check.outputs.mode }}
          WATCHLIST: ${{ github.event.inputs.watchlist || '' }}
          AI_BATCH: ${{ github.event_name == 'schedule' }}
          PUSH: ${{ github.event.inputs.push || '' }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Save results
        if: steps.again.outputs.go == 'true'
        run: |
          git config user.name "rumour-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Prices published to the Scout service aren't saved here too, so the repository stays small.
          if [ -f .stocks-published ]; then git checkout -- data/stocks.json 2>/dev/null || true; rm -f .stocks-published; fi
          git add data
          git diff --cached --quiet || (git commit -m "Update ${{ needs.check.outputs.mode }}" && git pull --rebase && git push)
